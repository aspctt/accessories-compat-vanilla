# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Mod Properties
# Per-target properties live in versions/<target>/gradle.properties

# Must fit the regex [a-z][a-z0-9_]{1,63} and match AccessoriesCompatVanilla.MOD_ID.
mod_id=accessoriescompatvanilla
# Base name of the built jar, which is published as <archives_name>-<mod_version>+<minecraft_version>.jar
mod_archives_name=AccessoriesCompatVanilla
mod_name=Accessories Compat: Vanilla
# SPDX identifier. See LICENSE, COPYING and COPYING.LESSER.
mod_license=LGPL-3.0-only
mod_version=1.0.0
# Should match the base package used for the mod sources.
mod_group_id=com.aspctt.accessoriescompatvanilla
mod_authors=aspctt
mod_description=Native Accessories support for the elytra and the Totem of Undying. Wear an elytra in the cape slot to fly with a chestplate on, and a totem in the charm slot to be saved without holding it.
