# Everything specific to one target lives here. Adding a target means adding a sibling
# directory, not editing the shared build scripts.
mod_loader=fabric

minecraft_version=1.21.1
# Fabric's dependency ranges are written the way fabric.mod.json expects rather than as Maven ranges.
# Exactly 1.21.1, not "~1.21.1": that is >=1.21.1 <1.22.0 in semver, so every 1.21.x would claim support
# and Modrinth would tag the file for all of them.
minecraft_version_range=1.21.1
loader_version=0.19.5
loader_version_range=>=0.16.0
fabric_api_version=0.116.17+1.21.1

# Accessories, from maven.wispforest.io. 1.1.0-beta.53 is the newest build for 1.21.1.
accessories_version=1.1.0-beta.53+1.21.1
accessories_version_range=>=1.1.0-beta.53
